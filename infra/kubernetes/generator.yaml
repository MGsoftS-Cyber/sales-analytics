apiVersion: batch/v1
kind: Job
metadata:
  name: generate-sales
  namespace: storescope
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: task
        image: storescope-app:1.0.0
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - generator.generate
        - --rows
        - '100000'
        - --output
        - /data/raw
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 1Gi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sales-data
