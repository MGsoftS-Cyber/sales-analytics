apiVersion: batch/v1
kind: Job
metadata:
  name: ingest-retail
  namespace: storescope
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: pandas-import
        image: storescope-app:1.0.0
        imagePullPolicy: IfNotPresent
        command: [python, -m, pipeline.ingest, --source, uci, --output, /data/retail, --limit, '100000']
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sales-data
