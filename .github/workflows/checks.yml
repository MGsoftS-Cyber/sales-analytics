name: Checks
on: [push, pull_request]
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas==2.2.3 openpyxl==3.1.5
      - run: python -m unittest discover -v
      - run: python -m compileall -q app generator pipeline
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check frontend/app.js
  spark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_spark -v
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait
      - run: docker compose run --rm generator
      - run: docker compose run --rm pipeline
      - run: curl --fail http://localhost:8080/api/overview
      - if: always()
        run: docker compose down -v
